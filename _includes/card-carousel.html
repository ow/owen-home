<div class="w-screen relative left-1/2 right-1/2 -translate-x-1/2 mt-6 overflow-hidden relative z-20 card-carousel-container" id="card-carousel-{{ include.id | default: 'default' }}" data-ascii-reactive style="overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; -webkit-overflow-scrolling: touch; cursor: grab;">
  <div class="flex animate-scroll-left gap-4 py-2 items-stretch carousel-content">
    {% for card in include.cards %}
      {% if card.url %}
        <a href="{{ card.url }}" class="group" {% if card.url contains 'http' %}target="_blank" rel="noopener noreferrer"{% endif %}>
      {% endif %}
      <div class="glass rounded-2xl overflow-hidden w-[300px] h-full flex flex-col border border-slate-700/30 md:hover:border-sky-400/50 transform transition-all duration-300 md:hover:scale-[1.03]">
        <img src="{{ card.image }}" alt="{{ card.title }}" class="w-full h-40 object-cover rounded-t-2xl">
        <div class="p-6 flex flex-col flex-1">
          <h3 class="heading-widget text-white mb-2">{{ card.title }}</h3>
          <p class="text-slate-200 text-md">{{ card.description }}</p>
        </div>
      </div>
      {% if card.url %}</a>{% endif %}
    {% endfor %}
    <!-- Duplicate for seamless loop -->
    {% for card in include.cards %}
      {% if card.url %}
        <a href="{{ card.url }}" class="group" {% if card.url contains 'http' %}target="_blank" rel="noopener noreferrer"{% endif %}>
      {% endif %}
      <div class="glass rounded-2xl overflow-hidden w-[300px] h-full flex flex-col border border-slate-700/30 md:hover:border-sky-400/50 transform transition-all duration-300 md:hover:scale-[1.03]">
        <img src="{{ card.image }}" alt="{{ card.title }}" class="w-full h-40 object-cover rounded-t-2xl">
        <div class="p-6 flex flex-col flex-1">
          <h3 class="heading-widget text-white mb-2">{{ card.title }}</h3>
          <p class="text-slate-200 text-md">{{ card.description }}</p>
        </div>
      </div>
      {% if card.url %}</a>{% endif %}
    {% endfor %}
  </div>
</div>

<script>
(function() {
  const carouselId = 'card-carousel-{{ include.id | default: "default" }}';
  const carousel = document.getElementById(carouselId);
  let activePointerId = null;
  let startX = 0;
  let startScrollLeft = 0;
  let isDragging = false;
  let suppressClick = false;
  let resumeTimer = null;

  carousel.style.scrollbarWidth = 'none';
  carousel.style.msOverflowStyle = 'none';

  const pauseAutoplay = () => {
    window.clearTimeout(resumeTimer);
    carousel.classList.add('is-interacting');
  };

  const resumeAutoplay = () => {
    window.clearTimeout(resumeTimer);
    resumeTimer = window.setTimeout(() => {
      carousel.classList.remove('is-interacting');
    }, 1200);
  };

  carousel.addEventListener('pointerdown', (event) => {
    if (!event.isPrimary || event.button > 0) return;

    pauseAutoplay();

    // Touch keeps the browser's native scrolling and momentum. Mouse and pen
    // use a direct 1:1 drag so movement stays locked to the pointer.
    if (event.pointerType === 'touch') return;

    activePointerId = event.pointerId;
    startX = event.clientX;
    startScrollLeft = carousel.scrollLeft;
    isDragging = false;
    carousel.setPointerCapture(event.pointerId);
    carousel.classList.add('dragging');
  });

  carousel.addEventListener('pointermove', (event) => {
    if (event.pointerId !== activePointerId) return;

    const deltaX = event.clientX - startX;
    if (Math.abs(deltaX) > 3) {
      isDragging = true;
      suppressClick = true;
    }

    if (!isDragging) return;
    event.preventDefault();
    carousel.scrollLeft = startScrollLeft - deltaX;
  });

  const finishInteraction = (event) => {
    const completedDrag = event.pointerId === activePointerId && isDragging;
    if (event.pointerId === activePointerId) {
      if (carousel.hasPointerCapture(event.pointerId)) {
        carousel.releasePointerCapture(event.pointerId);
      }
      activePointerId = null;
      isDragging = false;
      carousel.classList.remove('dragging');
    }
    if (completedDrag) {
      window.setTimeout(() => { suppressClick = false; }, 0);
    }
    resumeAutoplay();
  };

  carousel.addEventListener('pointerup', finishInteraction);
  carousel.addEventListener('pointercancel', finishInteraction);
  carousel.addEventListener('dragstart', (event) => event.preventDefault());
  carousel.addEventListener('click', (event) => {
    if (!suppressClick) return;
    event.preventDefault();
    event.stopPropagation();
    suppressClick = false;
  }, true);
})();
</script>

<style>
  #card-carousel-{{ include.id | default: 'default' }} {
    overflow-x: auto;
    scrollbar-width: none; /* Firefox */
    -ms-overflow-style: none; /* IE and Edge */
  }

  #card-carousel-{{ include.id | default: 'default' }}::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Opera */
  }
  
  /* Keep direct manipulation synchronous; touch momentum remains native. */
  #card-carousel-{{ include.id | default: 'default' }} {
    scroll-behavior: auto;
    -webkit-overflow-scrolling: touch;
  }

  #card-carousel-{{ include.id | default: 'default' }}.is-interacting .carousel-content {
    animation-play-state: paused;
  }
  
  /* Prevent text selection during drag */
  #card-carousel-{{ include.id | default: 'default' }}.dragging {
    cursor: grabbing !important;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
  }
</style>
