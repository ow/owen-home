<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <link rel="apple-touch-icon" sizes="180x180" href="{{ "/images/favicons/apple-touch-icon.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/images/favicons/favicon-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/images/favicons/favicon-16x16.png" | relative_url }}">
    <link rel="shortcut icon" href="{{ "/images/favicons/favicon-32x32.png" | relative_url }}">
    <link rel="mask-icon" href="{{ "/images/favicons/safari-pinned-tab.svg" | relative_url }}" color="#5bbad5">

    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}?v={{ site.time | date: '%s' }}">

    <link rel="manifest" href="{{ "/manifest.json" | relative_url }}">
    <meta name="theme-color" content="#0f172a">
    <meta name="google-site-verification" content="clli-zuXIqHkTVmGd6nv4NoVS8PLdrvaAtojJd-NUkc" />
    
    {% seo %}
    
    {% if page.profile_page %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "@id": "{{ page.url | absolute_url }}#profile-page",
      "mainEntity": {
        "@type": "Person",
        "@id": "{{ site.url }}#person",
        "name": "{{ page.author.name | default: site.author.name | default: page.seo.name }}",
        {% if page.author.twitter %}
        "alternateName": "{{ page.author.twitter }}",
        {% endif %}
        "description": "{{ page.author.bio | default: site.description | strip_html | strip_newlines | truncate: 160 }}",
        {% if page.author.picture or site.author.picture %}
        "image": "{{ page.author.picture | default: site.author.picture | absolute_url }}",
        {% endif %}
        {% if page.author.job_title %}
        "jobTitle": "{{ page.author.job_title }}",
        {% endif %}
        {% if page.author.company %}
        "worksFor": {
          "@type": "Organization",
          "name": "{{ page.author.company }}"
        },
        {% endif %}
        {% if page.author.location %}
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "{{ page.author.location }}"
        },
        {% endif %}
        {% if page.seo.links %}
        "sameAs": [
          {% for link in page.seo.links %}
          "{{ link }}"{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        {% endif %}
        "url": "{{ site.url }}"
      },
      "url": "{{ page.url | absolute_url }}"
    }
    </script>
    {% endif %}

    {% if page.web_application %}
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "{{ page.title }}",
      "description": "{{ page.description }}",
      "url": "{{ page.url | absolute_url }}",
      "applicationCategory": "DesignApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript and HTML5 Canvas",
      "author": {
        "@id": "{{ site.url }}#person"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    {% endif %}
    
    <script>
      // Force dark mode by default; did this to potentially support light mode in the future
      document.documentElement.classList.add('dark');
    </script>

    {% if site.google_analytics and jekyll.environment == 'production' %}
    <script>
      window.addEventListener('load', function () {
        var loadAnalytics = function () {
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', '{{ site.google_analytics }}');

          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}';
          document.head.appendChild(script);
        };

        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadAnalytics, { timeout: 3000 });
        } else {
          setTimeout(loadAnalytics, 1500);
        }
      }, { once: true });
    </script>
    {% endif %}

    {% if page.ascii_controls %}
    <link rel="stylesheet" href="{{ '/assets/css/control-panel.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/ascii-background.css' | relative_url }}">
    {% endif %}

</head>
