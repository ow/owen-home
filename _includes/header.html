<header class="fixed top-0 left-0 right-0 z-50 transition-colors duration-200 w-full bg-transparent border-b border-transparent" id="main-header">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="flex items-center justify-between h-16" aria-label="Primary navigation">
      <a href="/" class="text-2xl font-bold text-white hover:text-sky-300 transition-colors duration-200">{{ site.title }}</a>

      <div class="hidden md:flex md:items-center md:space-x-7">
        <a href="/about/" class="header-link text-white hover:text-sky-300 transition-colors">About</a>
        <a href="/work/" class="header-link text-white hover:text-sky-300 transition-colors">Work</a>
        <a href="/ai-design-leadership/" class="header-link text-white hover:text-sky-300 transition-colors">AI leadership</a>
        <a href="/contact/" class="header-link text-white hover:text-sky-300 transition-colors">Contact</a>
        <a href="https://twitter.com/ow" target="_blank" rel="me noopener noreferrer" aria-label="Owen Williams on Twitter" class="header-link text-white hover:text-sky-300 transition-colors p-2 -m-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84"></path></svg>
        </a>
        <a href="https://www.linkedin.com/in/owenpwilliams/" target="_blank" rel="me noopener noreferrer" aria-label="Owen Williams on LinkedIn" class="header-link text-white hover:text-sky-300 transition-colors p-2 -m-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"></path></svg>
        </a>
      </div>

      <button
        type="button"
        id="mobile-menu-button"
        class="md:hidden w-11 h-11 inline-flex items-center justify-center text-white hover:text-sky-300 rounded-lg focus-ring"
        aria-controls="mobile-menu"
        aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </nav>
  </div>

  <nav class="md:hidden hidden w-full bg-slate-900/95 backdrop-blur-sm" id="mobile-menu" aria-label="Mobile navigation">
    <div class="max-w-6xl mx-auto px-4 py-3">
      <a href="/about/" class="block px-3 py-3 text-white hover:text-sky-300">About</a>
      <a href="/work/" class="block px-3 py-3 text-white hover:text-sky-300">Work</a>
      <a href="/ai-design-leadership/" class="block px-3 py-3 text-white hover:text-sky-300">AI leadership</a>
      <a href="/blog/" class="block px-3 py-3 text-white hover:text-sky-300">Blog</a>
      <a href="/contact/" class="block px-3 py-3 text-white hover:text-sky-300">Contact</a>
    </div>
  </nav>
</header>

<script>
  (function () {
    var header = document.getElementById('main-header');
    var links = header.querySelectorAll('.header-link');
    var button = document.getElementById('mobile-menu-button');
    var menu = document.getElementById('mobile-menu');
    var ticking = false;

    function updateHeader() {
      var scrolled = window.scrollY > 50;
      header.classList.toggle('backdrop-blur-md', scrolled);
      header.classList.toggle('bg-slate-900/90', scrolled);
      header.classList.toggle('border-white/10', scrolled);
      header.classList.toggle('bg-transparent', !scrolled);
      links.forEach(function (link) {
        link.classList.toggle('text-white', true);
      });
      ticking = false;
    }

    window.addEventListener('scroll', function () {
      if (!ticking) {
        requestAnimationFrame(updateHeader);
        ticking = true;
      }
    }, { passive: true });

    button.addEventListener('click', function () {
      var isOpen = button.getAttribute('aria-expanded') === 'true';
      button.setAttribute('aria-expanded', String(!isOpen));
      button.querySelector('.sr-only').textContent = isOpen ? 'Open main menu' : 'Close main menu';
      menu.classList.toggle('hidden', isOpen);
      header.classList.toggle('bg-slate-900/95', !isOpen);
    });

    updateHeader();
  }());
</script>
